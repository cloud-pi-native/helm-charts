{{- if .Values.ingress.enabled -}}
{{- $fullName := include "cpnConsole.fullname" . -}}
{{- $svcPortClient := .Values.client.service.port -}}
{{- $svcPortBackend := .Values.backend.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cpnConsole.fullname" . }}
  {{- with .Values.ingress.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if gt (len .Values.ingress.tls) 0 }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName | quote | default (printf "%s-%s" $fullName "console-secret") }}
    {{- end }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $fullName }}-client
            port:
              number: {{ $svcPortClient }}
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ $fullName }}-backend
            port:
              number: {{ $svcPortBackend }}
      - path: /swagger-ui-server-nestjs
        pathType: Prefix
        backend:
          service:
            name: {{ $fullName }}-backend
            port:
              number: {{ $svcPortBackend }}
      - path: /swagger-ui-server-nestjs-json
        pathType: Exact
        backend:
          service:
            name: {{ $fullName }}-backend
            port:
              number: {{ $svcPortBackend }}
      - path: /swagger-ui-server-nestjs-yaml
        pathType: Exact
        backend:
          service:
            name: {{ $fullName }}-backend
            port:
              number: {{ $svcPortBackend }}
  {{- end }}
{{- end }}
